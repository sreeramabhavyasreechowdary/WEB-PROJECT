
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Management System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
    <div class="container-fluid">

        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-book-half"></i>
            LMS + ToDo
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navMenu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navMenu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       href="#dashboard">
                       Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="#library">
                       Library
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="#todo">
                       To-Do
                    </a>
                </li>

            </ul>

        </div>

    </div>
</nav>

<div class="container-fluid mt-4">

<!-- Dashboard -->
<section id="dashboard">

<h2 class="section-title">
    Dashboard
</h2>

<div class="row g-4">

    <div class="col-lg-3 col-md-6 col-sm-12">
         <div class="card dashboard-card card-1">
            <div class="card-body text-center">
                <i class="bi bi-book dashboard-icon"></i>
                <h5>Total Books</h5>
                <h2 id="totalBooks">0</h2>
            </div>
        </div>
    </div>

    <div class="col-lg-3 col-md-6 col-sm-12">
          <div class="card dashboard-card card-2">
            <div class="card-body text-center">
                <i class="bi bi-check-circle dashboard-icon"></i>
                <h5>Available</h5>
                <h2 id="availableBooks">0</h2>
            </div>
        </div>
    </div>

    <div class="col-lg-3 col-md-6 col-sm-12">
          <div class="card dashboard-card card-3">
            <div class="card-body text-center">
                <i class="bi bi-arrow-right-circle dashboard-icon"></i>
                <h5>Issued</h5>
                <h2 id="issuedBooks">0</h2>
            </div>
        </div>
    </div>

    <div class="col-lg-3 col-md-6 col-sm-12">
         <div class="card dashboard-card card-4">
            <div class="card-body text-center">
                <i class="bi bi-list-task dashboard-icon"></i>
                <h5>Pending Tasks</h5>
                <h2 id="pendingTasks">0</h2>
            </div>
        </div>
    </div>

</div>

</section>

<!-- Library Section -->
<section id="library" class="mt-5">

<h2 class="section-title">
    Library Management
</h2>

<div id="alertBox"></div>

<div class="card glass-card">

<div class="card-body">

<div class="row">

<div class="col-md-3 mb-3">
<input
type="text"
id="bookTitle"
class="form-control"
placeholder="Book Title">
</div>

<div class="col-md-3 mb-3">
<input
type="text"
id="bookAuthor"
class="form-control"
placeholder="Author">
</div>

<div class="col-md-3 mb-3">
<input
type="text"
id="bookCategory"
class="form-control"
placeholder="Category">
</div>

<div class="col-md-3 mb-3">
<button
class="btn btn-success w-100"
onclick="addBook()">
<i class="bi bi-plus-circle"></i>
 Add Book
</button>
</div>

</div>

<div class="row mt-3">

<div class="col-md-12">

<input
type="text"
id="searchInput"
class="form-control"
placeholder="Search Book..."
onkeyup="searchBook()">

</div>

</div>

<div class="table-responsive mt-4">

<table class="table table-hover table-bordered">

<thead class="table-dark">

<tr>
<th>ID</th>
<th>Title</th>
<th>Author</th>
<th>Category</th>
<th>Status</th>
<th>Actions</th>
</tr>

</thead>

<tbody id="bookTableBody">

</tbody>

</table>

</div>

</div>

</div>

</section>

<!-- Todo Section -->
<section id="todo" class="mt-5">

<h2 class="section-title">
    To-Do Manager
</h2>

<div class="card glass-card">

<div class="card-body">

<div class="row">

<div class="col-md-8 mb-3">

<input
type="text"
id="taskInput"
class="form-control"
placeholder="Enter Task">

</div>

<div class="col-md-4 mb-3">

<button
class="btn btn-primary w-100"
onclick="addTask()">

<i class="bi bi-plus-lg"></i>
 Add Task

</button>

</div>

</div>

<ul
id="taskList"
class="list-group">

</ul>

</div>

</div>

</section>

</div>

<footer class="text-center mt-5 p-3 footer">

Library Management System with To-Do Manager
© 2026

</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- External JS -->
<script src="script.js"></script>

</body>
</html>
```
